name: Release

# Push a tag like v0.1.0 to build installers and create a DRAFT pre-release.
# Review the attached files, then publish the draft manually.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match app version
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match tauri.conf.json version v${version}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Same gates as CI (.github/workflows/build.yml): an installer must never ship from a
      # commit that would fail there.
      - run: npm ci
      - run: python scripts/test-paddleocr-worker.py
      - run: python scripts/test-rapidocr-worker.py
      - run: node --test scripts/test-settings-i18n.mjs scripts/test-translation.mjs
      - run: npm run build
      - run: npx playwright install chromium
      - run: npm run test:render
      - run: cargo test --manifest-path src-tauri/Cargo.toml --test desktop --locked

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: OverText ${{ github.ref_name }}
          releaseBody: |
            Pre-release. **Not code-signed**: see "Installing an unsigned build" in the README.
            macOS: Apple Silicon, macOS 13+. Windows: 10/11 (OCR engine is installed from Settings).
            See CHANGELOG.md for what is included and the known limitations.
          releaseDraft: true
          prerelease: true
