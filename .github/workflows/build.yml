name: Desktop checks

on:
  push:
  pull_request:

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/test-paddleocr-worker.py
      - run: npm run build
      - run: node --test scripts/test-settings-i18n.mjs scripts/test-translation.mjs
      - run: npx playwright install chromium
      - run: npm run test:render
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: render-results-${{ matrix.os }}
          path: test-results/
          if-no-files-found: ignore
      - run: cargo test --manifest-path src-tauri/Cargo.toml --test desktop --locked
      - run: npm run tauri build -- --no-bundle
